<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Билд под матч в Deadlock — советник по предметам</title>
  <meta name="description" content="Выбери своего героя, врагов на линии и в команде — сайт соберёт билд под этот матч: порядок покупки, контр-предметы и замены. По свежей статистике матчей Deadlock.">
  <link rel="canonical" href="https://naivgot.github.io/deadlock-build-advisor/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:site_name" content="Билд под матч">
  <meta property="og:title" content="Билд под матч в Deadlock">
  <meta property="og:description" content="Выбери своего героя и врагов — сайт соберёт билд под этот матч: порядок покупки, контр-предметы и замены.">
  <meta property="og:url" content="https://naivgot.github.io/deadlock-build-advisor/">
  <meta property="og:image" content="https://naivgot.github.io/deadlock-build-advisor/icon-512.png">
  <meta name="theme-color" content="#14161b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1>Билд под матч</h1>
    <p class="muted" id="data-date">Загружаю данные…</p>
  </header>

  <main id="app" hidden>
    <section class="card" id="team">
      <h2>Твоя линия</h2>
      <div class="lane">
        <div class="slot-group" id="slots-lane-ally"></div>
        <span class="vs" aria-hidden="true">против</span>
        <div class="slot-group" id="slots-lane-enemy"></div>
      </div>
      <h2>Остальные враги</h2>
      <div class="slot-group slot-row" id="slots-enemy"></div>
      <details id="allies-details">
        <summary>Остальные союзники <span class="muted">необязательно</span></summary>
        <div class="slot-group slot-row" id="slots-ally"></div>
      </details>
    </section>

    <section class="card" id="picker" aria-live="polite">
      <div class="picker-head">
        <h2 id="picker-title">Выбери своего героя</h2>
        <button type="button" class="btn btn-quiet" id="slot-clear" hidden>Убрать</button>
      </div>
      <input type="search" id="hero-search" class="search" placeholder="Поиск героя" autocomplete="off" aria-label="Поиск героя">
      <div id="hero-grid" class="grid grid-heroes"></div>
    </section>

    <section id="result" hidden></section>

    <details class="card" id="settings">
      <summary>Настройки</summary>
      <label class="rank-row">
        <span class="muted">Мой ранг</span>
        <select id="rank"></select>
      </label>
    </details>

    <a class="btn btn-link" href="heroes/">Билды на всех героев →</a>
  </main>

  <p class="load-error" id="load-error" hidden></p>

  <div class="sticky">
    <button type="button" class="btn-primary" id="go">Собрать билд</button>
  </div>

  <footer class="footer">
    <p>Не связан с Valve. Данные: deadlock-api.com.</p>
    <p class="muted">Посещения считает Яндекс Метрика.</p>
    <p class="muted" id="footer-date"></p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
