<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Что купить в Deadlock — советник по билдам</title>
  <meta name="description" content="Выбери героя, врагов и души — советник покажет три предмета к покупке и объяснит почему. По свежей статистике матчей Deadlock.">
  <meta name="theme-color" content="#14161b">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1>Что купить в Deadlock</h1>
    <p class="muted" id="data-date">Загружаю данные…</p>
  </header>

  <main id="app" hidden>
    <section class="card" id="step-hero">
      <h2><span class="step">1</span>Мой герой</h2>
      <div id="hero-picked" class="picked" hidden></div>
      <div id="hero-picker">
        <input type="search" id="hero-search" class="search" placeholder="Поиск героя" autocomplete="off" aria-label="Поиск героя">
        <div id="hero-grid" class="grid grid-heroes"></div>
      </div>
    </section>

    <section class="card" id="step-enemies">
      <h2><span class="step">2</span>Враги <span class="muted count" id="enemy-count"></span></h2>
      <div id="enemy-picked" class="chips"></div>
      <details id="enemy-details" open>
        <summary>Выбрать врагов</summary>
        <input type="search" id="enemy-search" class="search" placeholder="Поиск героя" autocomplete="off" aria-label="Поиск врага">
        <div id="enemy-grid" class="grid grid-heroes"></div>
      </details>
    </section>

    <section class="card" id="step-souls">
      <h2><span class="step">3</span>Души на руках</h2>
      <div class="souls-row">
        <input type="number" id="souls" class="souls-input" min="0" step="100" inputmode="numeric" value="0" aria-label="Сколько душ на руках">
        <button type="button" class="btn" data-add="500">+500</button>
        <button type="button" class="btn" data-add="1000">+1000</button>
        <button type="button" class="btn btn-quiet" id="souls-reset">Сброс</button>
      </div>
      <label class="rank-row">
        <span class="muted">Мой ранг</span>
        <select id="rank"></select>
      </label>
    </section>

    <section class="card" id="step-owned">
      <details id="owned-details">
        <summary><span class="step">4</span>Купленные предметы <span class="muted count" id="owned-count">необязательно</span></summary>
        <input type="search" id="item-search" class="search" placeholder="Поиск предмета" autocomplete="off" aria-label="Поиск предмета">
        <div class="tabs" id="item-tabs" role="tablist"></div>
        <div id="item-grid"></div>
      </details>
    </section>

    <section id="result" aria-live="polite" hidden></section>
  </main>

  <p class="load-error" id="load-error" hidden></p>

  <div class="sticky">
    <button type="button" class="btn-primary" id="go">Что купить</button>
  </div>

  <footer class="footer">
    <p>Не связан с Valve. Данные: deadlock-api.com.</p>
    <p class="muted" id="footer-date"></p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
