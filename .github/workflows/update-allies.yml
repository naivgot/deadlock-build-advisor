# Медленный сбор статистики союзников (задача 1.5е): ~3 часа из-за лимита SQL-запросов API.
# Результат — маленькие файлы data/allies/*.json — коммитится в репозиторий и попадает на сайт при следующей ночной сборке.
# Если отдельные герои не собрались — остаются их прошлые данные; сбор от этого не падает.
name: Статистика союзников

on:
  schedule:
    - cron: '0 9 * * *' # каждый день в 12:00 по Минску (09:00 UTC) — после ночного обновления
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: allies
  cancel-in-progress: false

jobs:
  allies:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Нужна дата текущего патча — берём из кэша ночного запуска (если его нет — из репозитория).
      - name: Взять данные последнего ночного запуска
        uses: actions/cache/restore@v4
        with:
          path: |
            data/static
            data/stats
          key: data-none
          restore-keys: data-

      - name: Собрать статистику союзников
        timeout-minutes: 280
        run: npm run fetch:allies
        env:
          DEADLOCK_API_KEY: ${{ secrets.DEADLOCK_API_KEY }}

      - name: Сохранить в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/allies
          if git diff --cached --quiet; then
            echo "Данные союзников не изменились"
            exit 0
          fi
          git commit -m "Статистика союзников от $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
