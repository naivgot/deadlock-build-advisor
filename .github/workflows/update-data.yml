# Раз в сутки (и по кнопке) скачивает свежие данные, проверяет их тестами, собирает сайт и публикует на GitHub Pages.
# Если любой шаг упал — публикации нет, на сайте остаются вчерашние данные, а GitHub присылает письмо об ошибке.
# При изменении кода (push) и в быстром режиме (quick, его запускает сбор союзников) сайт пересобирается
# без долгого сбора: данные берутся из кэша последнего ночного запуска.
name: Обновление данных и сайта

on:
  schedule:
    - cron: '30 3 * * *' # каждый день в 06:30 по Минску (03:30 UTC)
  workflow_dispatch: # кнопка «Run workflow» на вкладке Actions
    inputs:
      quick:
        description: 'Быстро: без скачивания статистики, только пересобрать сайт'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['site/**', 'src/**', 'scripts/build-site.js', 'data/manual/**', 'data/teams/**', 'data/sells/**', '.github/workflows/update-data.yml']

permissions:
  contents: read
  pages: write
  id-token: write

# Две публикации одновременно не запускаем: новая ждёт, пока закончится старая.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      QUICK: ${{ github.event_name == 'push' || inputs.quick == true }}
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Ночной запуск: свежие данные из API.
      - name: Скачать героев и предметы
        if: env.QUICK != 'true'
        run: npm run fetch:static
        env:
          DEADLOCK_API_KEY: ${{ secrets.DEADLOCK_API_KEY }}

      - name: Скачать статистику патча
        if: env.QUICK != 'true'
        timeout-minutes: 240
        run: npm run fetch:stats
        env:
          DEADLOCK_API_KEY: ${{ secrets.DEADLOCK_API_KEY }}

      # Сводка для страницы «Что изменил патч». Если не скачалась — страница останется вчерашней, сборка не падает.
      - name: Скачать сводку по патчам
        if: env.QUICK != 'true'
        continue-on-error: true
        timeout-minutes: 30
        run: npm run fetch:patch
        env:
          DEADLOCK_API_KEY: ${{ secrets.DEADLOCK_API_KEY }}

      # Популярные игровые билды для карточки «Готовый билд из игры» (Д2б). Не вышло — останутся вчерашние.
      - name: Скачать игровые билды
        if: env.QUICK != 'true'
        continue-on-error: true
        timeout-minutes: 60
        run: npm run fetch:builds
        env:
          DEADLOCK_API_KEY: ${{ secrets.DEADLOCK_API_KEY }}

      # ВНИМАНИЕ: список папок кэша должен совпадать здесь и в «Взять данные…» ниже. Кэш GitHub привязан
      # к этому списку: если его поменять, быстрые сборки не найдут старый кэш, пока не пройдёт полный запуск
      # (ночью или кнопкой Run workflow). До этого быстрые сборки не публикуют сайт (см. проверку ниже).
      - name: Сохранить данные в кэш для следующих сборок
        if: env.QUICK != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/static
            data/stats
            data/patch
            data/builds
          key: data-${{ github.run_id }}

      # Сборка после изменения кода: последние данные из кэша (если кэша нет — данные из репозитория).
      - name: Взять данные последнего ночного запуска
        id: restore
        if: env.QUICK == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/static
            data/stats
            data/patch
            data/builds
          key: data-none
          restore-keys: data-

      # Кэш не нашёлся — данные в репозитории старые. Не публикуем, чтобы не откатить сайт на них.
      - name: Проверить, что данные из кэша нашлись
        if: env.QUICK == 'true' && steps.restore.outputs.cache-matched-key == ''
        run: |
          echo "::error::Кэш ночного запуска не найден (возможно, поменяли список папок кэша). Сайт не публикую, чтобы не откатить данные. Запусти полное обновление: Actions → «Обновление данных и сайта» → Run workflow."
          exit 1

      - name: Тесты
        run: npm test

      - name: Собрать сайт на свежих данных
        if: env.QUICK != 'true'
        run: npm run build:site

      - name: Собрать сайт на данных из кэша
        if: env.QUICK == 'true'
        run: npm run build:site -- --allow-stale

      - name: Подготовить публикацию
        uses: actions/configure-pages@v5

      - name: Упаковать сайт
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
