# Медленный сбор статистики союзников и врагов (задачи 1.5д и 1.5е): ~3 часа из-за лимита SQL-запросов API.
# Результат — маленькие файлы data/teams/*.json — коммитится в репозиторий, после чего сайт сразу
# пересобирается в быстром режиме (коммит бота сам по себе сборку не запускает — так устроен GitHub).
# Если отдельные герои не собрались — остаются их прошлые данные; сбор от этого не падает.
name: Статистика союзников и врагов

on:
  schedule:
    - cron: '0 9 * * *' # каждый день в 12:00 по Минску (09:00 UTC) — после ночного обновления
  workflow_dispatch:

permissions:
  contents: write
  actions: write # чтобы запустить пересборку сайта

concurrency:
  group: allies
  cancel-in-progress: false

jobs:
  allies:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Нужна дата текущего патча — берём из кэша ночного запуска (если его нет — из репозитория).
      # Список папок — тот же, что при сохранении в update-data.yml, иначе кэш не найдётся.
      - name: Взять данные последнего ночного запуска
        uses: actions/cache/restore@v4
        with:
          path: |
            data/static
            data/stats
            data/patch
            data/builds
          key: data-none
          restore-keys: data-

      # Продажи предметов и число слотов (задача Д2): 2 SQL-запроса. Если не вышло — остаются вчерашние данные.
      - name: Собрать продажи предметов
        continue-on-error: true
        timeout-minutes: 10
        run: npm run fetch:sells
        env:
          DEADLOCK_API_KEY: ${{ secrets.DEADLOCK_API_KEY }}

      - name: Собрать статистику союзников и врагов
        timeout-minutes: 280
        run: npm run fetch:teams
        env:
          DEADLOCK_API_KEY: ${{ secrets.DEADLOCK_API_KEY }}

      - name: Сохранить в репозиторий
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/teams data/sells
          if git diff --cached --quiet; then
            echo "Данные не изменились"
            exit 0
          fi
          git commit -m "Статистика союзников и врагов от $(date -u +%Y-%m-%d)"
          # --autostash: файлы из кэша ночного запуска отличаются от репозитория — git отложит их на время подтягивания
          git pull --rebase --autostash
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Пересобрать сайт с новыми данными
        if: steps.save.outputs.changed == 'true'
        run: gh workflow run update-data.yml --ref main -f quick=true
        env:
          GH_TOKEN: ${{ github.token }}
